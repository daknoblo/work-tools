name: tool - markitdown-mcp

# Builds the MarkItDown MCP server from the tree mirrored under vendor/markitdown and
# pushes it to this repository's GitHub Container Registry namespace. Upstream publishes
# no image.
#
# Upstream changes arrive through sync-markitdown-mcp.yml, so this workflow never reaches
# out to upstream itself and every image maps to one commit of this repository.
#
# Each architecture is built and smoke-tested on a runner of that architecture, then the
# two are joined into one manifest.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Additional image tag (optional, e.g. "v0.1.7")
        type: string
        default: ''
      push:
        description: Push the image to GHCR (uncheck for a build-only dry run)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/tool-markitdown-mcp.yml
      - scripts/mcp-smoke.sh
      - tools/markitdown-mcp/**
      - vendor/markitdown/**

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: markitdown-mcp
  VENDOR_DIR: vendor/markitdown

jobs:
  prepare:
    name: Resolve tags and labels
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ctx.outputs.image }}
      version: ${{ steps.ctx.outputs.version }}
      upstream_ref: ${{ steps.ctx.outputs.upstream_ref }}
      upstream_sha: ${{ steps.ctx.outputs.upstream_sha }}
      push: ${{ steps.ctx.outputs.push }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve build context
        id: ctx
        run: |
          # The wrapper package still declares 0.0.1a5, which says nothing about what is
          # shipped; the core library version is what upstream actually releases.
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' \
            "${VENDOR_DIR}/packages/markitdown/src/markitdown/__about__.py")"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
            echo "version=${version}"
            echo "upstream_repository=$(jq -er '.repository' "${VENDOR_DIR}/UPSTREAM.json")"
            echo "upstream_ref=$(jq -er '.ref' "${VENDOR_DIR}/UPSTREAM.json")"
            echo "upstream_sha=$(jq -er '.commit' "${VENDOR_DIR}/UPSTREAM.json")"
            echo "push=${{ github.event_name != 'workflow_dispatch' || inputs.push }}"
          } >> "$GITHUB_OUTPUT"

      # Resolved once here rather than per architecture, so the tag and label set
      # cannot drift between the two.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ctx.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.version != '' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.title=MarkItDown MCP server
            org.opencontainers.image.description=MarkItDown document-to-Markdown MCP server, built from a vendored upstream tree
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ steps.ctx.outputs.upstream_repository }}
            org.opencontainers.image.version=${{ steps.ctx.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ctx.outputs.upstream_sha }}
            org.opencontainers.image.licenses=MIT
            io.workflow.upstream.repository=${{ steps.ctx.outputs.upstream_repository }}
            io.workflow.upstream.ref=${{ steps.ctx.outputs.upstream_ref }}

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name this platform
        id: plat
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "key=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      # vendor/ stays a verbatim mirror, so local changes are applied here rather than
      # committed into it.
      - name: Apply local patches
        run: |
          shopt -s nullglob
          patches=(tools/markitdown-mcp/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No local patches."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git apply --directory="${VENDOR_DIR}" "$patch"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built and verified before anything is published, so a broken build can never
      # move the `latest` tag that the VPS pulls.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.VENDOR_DIR }}
          file: tools/markitdown-mcp/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}

      - name: Smoke test image
        env:
          # Converting an HTML data: URI exercises a real converter, which is what proves
          # the [all] extra resolved - listing the tool alone would not.
          MCP_SMOKE_CALL: '{"name":"convert_to_markdown","arguments":{"uri":"data:text/html;base64,PGgxPkhlbGxvPC9oMT4="}}'
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          docker run -d --name smoke -p 127.0.0.1:3001:3001 "${IMAGE_NAME}:smoke"
          trap 'docker logs smoke || true; docker rm -f smoke > /dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null --max-time 3 http://127.0.0.1:3001/mcp/; then break; fi
            sleep 2
          done

          # The trailing slash is load-bearing: the app is mounted at /mcp/, and /mcp
          # answers 307, which neither curl nor the gateway's HTTP client follows.
          scripts/mcp-smoke.sh http://127.0.0.1:3001/mcp/ convert_to_markdown

          # The core has to be the vendored one; if pip fell back to PyPI the whole point
          # of mirroring the source is lost.
          actual="$(docker run --rm --entrypoint python "${IMAGE_NAME}:smoke" \
            -c 'import markitdown; print(markitdown.__version__)')"
          if [ "$actual" != "$VERSION" ]; then
            echo "::error::image ships markitdown ${actual}, vendored source is ${VERSION}"
            exit 1
          fi
          echo "image ships the vendored markitdown ${actual}"

          # Upstream's wheels carry no licence file, so the image only has one because
          # the Dockerfile copies it out of the mirror.
          docker run --rm --entrypoint sh "${IMAGE_NAME}:smoke" -c 'test -s /licenses/LICENSE'
          echo "upstream licence ships with the image"

      # Pushed by digest and left untagged; the merge job is what gives these a name.
      - name: Build and push by digest
        id: build
        if: needs.prepare.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.VENDOR_DIR }}
          file: tools/markitdown-mcp/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ env.IMAGE_NAME }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

          first="$(printf '%s\n' "$TAGS" | sed -n '1p')"
          digest="$(docker buildx imagetools inspect "$first" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          echo "Published architectures:"
          docker buildx imagetools inspect "$first" \
            --format '{{ range .Manifest.Manifests }}{{ if .Platform.Architecture }}  {{ .Platform.OS }}/{{ .Platform.Architecture }}{{ println }}{{ end }}{{ end }}'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## markitdown-mcp"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream ref | \`${UPSTREAM_REF:-unknown}\` |"
            echo "| Upstream commit | \`${UPSTREAM_SHA:-unknown}\` |"
            echo "| Version | \`${VERSION:-unknown}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
