name: tool - azure-diagram-builder

# Builds the MCP server of the upstream "Azure Architecture Diagram Builder" from the
# tree mirrored under vendor/ and pushes it to this repository's GitHub Container
# Registry namespace. Only the MCP server ships: its 13 tools are deterministic, so the
# image needs no Azure OpenAI credentials and makes no outbound calls. The upstream web
# UI, its token server and its nginx front end are not part of this image.
#
# Upstream changes arrive through sync-azure-diagram-builder.yml, so this workflow never
# reaches out to upstream itself and every image maps to one commit of this repository.
#
# Each architecture is built and smoke-tested on a runner of that architecture, then the
# two are joined into one manifest.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Additional image tag (optional, e.g. "v1.10.1")
        type: string
        default: ''
      push:
        description: Push the image to GHCR (uncheck for a build-only dry run)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/tool-azure-diagram-builder.yml
      - scripts/mcp-smoke.sh
      - tools/azure-diagram-builder/**
      - vendor/azure-architecture-diagram-builder/**

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: azure-diagram-builder
  VENDOR_DIR: vendor/azure-architecture-diagram-builder
  # The upstream Dockerfile defaults NPM_REGISTRY to a Microsoft-internal proxy.
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  prepare:
    name: Resolve tags and labels
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ctx.outputs.image }}
      version: ${{ steps.ctx.outputs.version }}
      upstream_ref: ${{ steps.ctx.outputs.upstream_ref }}
      upstream_sha: ${{ steps.ctx.outputs.upstream_sha }}
      push: ${{ steps.ctx.outputs.push }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve build context
        id: ctx
        run: |
          # Provenance comes from the mirror, not from a live upstream lookup.
          version="$(jq -r '.version // ""' "${VENDOR_DIR}/package.json")"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
            echo "version=${version#v}"
            echo "upstream_repository=$(jq -er '.repository' "${VENDOR_DIR}/UPSTREAM.json")"
            echo "upstream_ref=$(jq -er '.ref' "${VENDOR_DIR}/UPSTREAM.json")"
            echo "upstream_sha=$(jq -er '.commit' "${VENDOR_DIR}/UPSTREAM.json")"
            echo "push=${{ github.event_name != 'workflow_dispatch' || inputs.push }}"
          } >> "$GITHUB_OUTPUT"

      # Resolved once here rather than per architecture, so the tag and label set
      # cannot drift between the two.
      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ctx.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.version != '' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.title=Azure Diagram Builder MCP server
            org.opencontainers.image.description=Deterministic Azure architecture MCP tools, built from a vendored upstream tree
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ steps.ctx.outputs.upstream_repository }}
            org.opencontainers.image.version=${{ steps.ctx.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ctx.outputs.upstream_sha }}
            org.opencontainers.image.licenses=MIT
            io.workflow.upstream.repository=${{ steps.ctx.outputs.upstream_repository }}
            io.workflow.upstream.ref=${{ steps.ctx.outputs.upstream_ref }}

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name this platform
        id: plat
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "key=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      # vendor/ stays a verbatim mirror, so local changes are applied here rather than
      # committed into it.
      - name: Apply local patches
        run: |
          shopt -s nullglob
          patches=(tools/azure-diagram-builder/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No local patches."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git apply --directory="${VENDOR_DIR}" "$patch"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built and verified before anything is published, so a broken build can never
      # move the `latest` tag that the VPS pulls. The build distils 108 MB of pricing
      # data and 700-odd icons into sidecars inside the image; a tools/list would not
      # notice if those came out empty, so the smoke test calls a tool as well.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.VENDOR_DIR }}
          file: ${{ env.VENDOR_DIR }}/mcp-server/Dockerfile
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}

      - name: Smoke test image
        env:
          MCP_BEARER: smoke-token
          MCP_SMOKE_CALL: '{"name":"list_services","arguments":{}}'
        run: |
          docker run -d --name smoke \
            -e MCP_AUTH_TOKEN=smoke-token \
            -p 127.0.0.1:3030:3030 "${IMAGE_NAME}:smoke"
          trap 'docker logs smoke || true; docker rm -f smoke > /dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3030/healthz; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3030/healthz
          echo "health endpoint answers"

          # The bearer gate runs ahead of any MCP handling, so this needs no handshake.
          for token in '' 'wrong-token'; do
            args=(-s -o /dev/null -w '%{http_code}' -X POST
                  -H 'Content-Type: application/json'
                  -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
            [ -n "$token" ] && args+=(-H "Authorization: Bearer ${token}")
            code="$(curl "${args[@]}" http://127.0.0.1:3030/mcp)"
            if [ "$code" != "401" ]; then
              echo "::error::expected 401 for token '${token}', got ${code}"
              exit 1
            fi
          done
          echo "missing and wrong bearer tokens are rejected"

          scripts/mcp-smoke.sh http://127.0.0.1:3030/mcp \
            list_services validate_architecture estimate_costs generate_bicep render_diagram

          # Put there by a patch, and a patch is the first thing dropped when it stops
          # applying - so the image is asked directly rather than trusted.
          docker run --rm --entrypoint sh "${IMAGE_NAME}:smoke" \
            -c 'test -s /licenses/LICENSE && test -s /licenses/NOTICE'
          echo "upstream licence and notice ship with the image"

      # Pushed by digest and left untagged; the merge job is what gives these a name.
      - name: Build and push by digest
        id: build
        if: needs.prepare.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.VENDOR_DIR }}
          file: ${{ env.VENDOR_DIR }}/mcp-server/Dockerfile
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ env.IMAGE_NAME }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

          first="$(printf '%s\n' "$TAGS" | sed -n '1p')"
          digest="$(docker buildx imagetools inspect "$first" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          echo "Published architectures:"
          docker buildx imagetools inspect "$first" \
            --format '{{ range .Manifest.Manifests }}{{ if .Platform.Architecture }}  {{ .Platform.OS }}/{{ .Platform.Architecture }}{{ println }}{{ end }}{{ end }}'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          UPSTREAM_REF: ${{ needs.prepare.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ needs.prepare.outputs.upstream_sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## azure-diagram-builder"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream ref | \`${UPSTREAM_REF:-unknown}\` |"
            echo "| Upstream commit | \`${UPSTREAM_SHA:-unknown}\` |"
            echo "| Version | \`${VERSION:-unknown}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
