name: tool - azure-diagram-builder

# Builds a container image for the upstream "Azure Architecture Diagram Builder"
# (https://github.com/Arturo-Quiroga-MSFT/azure-architecture-diagram-builder), which
# does not publish one itself, and pushes it to this repository's GitHub Container
# Registry namespace so it can be run on a VPS with docker compose.

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Upstream branch, tag or commit SHA to build
        type: string
        default: main
      image_tag:
        description: Additional image tag (optional, e.g. "v1.0.0")
        type: string
        default: ''
      platforms:
        description: Target platforms
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      push:
        description: Push the image to GHCR (uncheck for a build-only dry run)
        type: boolean
        default: true
  schedule:
    # Weekly rebuild so the deployed image picks up upstream changes.
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - .github/workflows/tool-azure-diagram-builder.yml
      - tools/azure-diagram-builder/**

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: Arturo-Quiroga-MSFT/azure-architecture-diagram-builder
  IMAGE_NAME: azure-diagram-builder

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPOSITORY }}
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: upstream
          persist-credentials: false

      - name: Resolve build context
        id: context
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
        run: |
          upstream_sha="$(git -C upstream rev-parse HEAD)"
          # The smoke test needs to run the image, which only works when building
          # a single image for the runner's own architecture.
          if [ "${PLATFORMS}" = "linux/amd64" ]; then smoke=true; else smoke=false; fi
          {
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_short_sha=${upstream_sha:0:7}"
            echo "registry_owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "platforms=${PLATFORMS}"
            echo "smoke=${smoke}"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip scheduled rebuild if upstream commit is already published
        id: published
        if: github.event_name == 'schedule'
        env:
          IMAGE_REF: ghcr.io/${{ steps.context.outputs.registry_owner }}/${{ env.IMAGE_NAME }}:upstream-${{ steps.context.outputs.upstream_short_sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_REF" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${IMAGE_REF} already exists - nothing to rebuild."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # All VITE_* values are compiled into the browser bundle, so they are public by
      # definition and live in a repository *variable*, not a secret. Runtime secrets
      # (Azure OpenAI key, MCP token) are injected on the VPS instead - see
      # tools/azure-diagram-builder/README.md.
      - name: Write build-time environment file
        if: steps.published.outputs.skip != 'true'
        working-directory: upstream
        env:
          BUILD_ENV: ${{ vars.AADB_BUILD_ENV }}
        run: |
          printf '%s\n' "${BUILD_ENV}" | tr -d '\r' | sed '/^[[:space:]]*$/d' > .env.build

          if [ ! -s .env.build ]; then
            echo "::warning::Repository variable AADB_BUILD_ENV is not set - the UI will start without any configured AI models."
            exit 0
          fi

          # The upstream Dockerfile sources this file through `xargs`, which mangles
          # whitespace, so reject anything that is not a plain KEY=VALUE line.
          if grep -vqE '^(#|[A-Za-z_][A-Za-z0-9_]*=[^[:space:]]*$)' .env.build; then
            echo "::error::AADB_BUILD_ENV must contain only comment lines or KEY=VALUE pairs without whitespace."
            exit 1
          fi

          echo "Configured build-time keys:"
          grep -oE '^[A-Za-z_][A-Za-z0-9_]*' .env.build | sort -u

      - name: Set up QEMU
        if: steps.published.outputs.skip != 'true' && contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.published.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      # Built and verified before anything is published, so a broken build can
      # never move the `latest` tag that the VPS pulls. This is not paranoia:
      # `npm ci` is known to report failure while still exiting 0, which would
      # otherwise produce an image whose Node services are silently missing.
      - name: Build image for smoke test
        if: steps.published.outputs.skip != 'true' && steps.context.outputs.smoke == 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Smoke test image
        if: steps.published.outputs.skip != 'true' && steps.context.outputs.smoke == 'true'
        run: |
          docker run -d --name smoke -p 127.0.0.1:8080:80 "${IMAGE_NAME}:smoke"
          trap 'docker logs smoke || true; docker rm -f smoke > /dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then break; fi
            sleep 2
          done

          echo "nginx serves the SPA"
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'

          echo "static assets are present"
          curl -fsS -o /dev/null http://127.0.0.1:8080/vite.svg
          curl -fsS -o /dev/null "http://127.0.0.1:8080/Azure_Public_Service_Icons/Icons/management%20%2B%20governance/00002-icon-service-Alerts.svg"

          # 502/504 means nginx is up but the Node process behind it is not.
          echo "token server is listening"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/speech-token)"
          case "$code" in 502|504|000) echo "::error::token server not reachable (HTTP $code)"; exit 1 ;; esac

          echo "MCP server is listening"
          curl -fsS -o /dev/null --max-time 15 http://127.0.0.1:8080/mcp/healthz

      - name: Derive image metadata
        id: meta
        if: steps.published.outputs.skip != 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.context.outputs.registry_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=upstream-${{ steps.context.outputs.upstream_short_sha }}
            type=raw,value={{date 'YYYYMMDD'}}-${{ steps.context.outputs.upstream_short_sha }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.title=Azure Architecture Diagram Builder
            org.opencontainers.image.description=Self-hosted build of the Azure Architecture Diagram Builder
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM_REPOSITORY }}
            org.opencontainers.image.revision=${{ steps.context.outputs.upstream_sha }}
            org.opencontainers.image.licenses=MIT
            io.workflow.upstream.repository=${{ env.UPSTREAM_REPOSITORY }}
            io.workflow.upstream.ref=${{ inputs.upstream_ref || 'main' }}

      - name: Build and push
        id: build
        if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/Dockerfile
          platforms: ${{ steps.context.outputs.platforms }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Attest build provenance
        if: steps.build.outcome == 'success' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.context.outputs.registry_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          SKIPPED: ${{ steps.published.outputs.skip }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
          UPSTREAM_SHA: ${{ steps.context.outputs.upstream_sha }}
        run: |
          {
            echo "## azure-diagram-builder"
            echo
            if [ "$SKIPPED" = "true" ]; then
              echo "Upstream commit already published - build skipped."
            else
              echo "| Field | Value |"
              echo "| --- | --- |"
              echo "| Upstream ref | \`${UPSTREAM_REF}\` |"
              echo "| Upstream commit | \`${UPSTREAM_SHA}\` |"
              echo "| Digest | \`${DIGEST:-n/a}\` |"
              echo
              echo "Tags:"
              echo '```'
              echo "${TAGS}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
