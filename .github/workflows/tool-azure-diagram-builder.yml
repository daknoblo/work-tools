name: tool - azure-diagram-builder

# Builds the MCP server of the upstream "Azure Architecture Diagram Builder" from the
# tree mirrored under vendor/ and pushes it to this repository's GitHub Container
# Registry namespace. Only the MCP server ships: its 13 tools are deterministic, so the
# image needs no Azure OpenAI credentials and makes no outbound calls. The upstream web
# UI, its token server and its nginx front end are not part of this image.
#
# Upstream changes arrive through sync-azure-diagram-builder.yml, so this workflow never
# reaches out to upstream itself and every image maps to one commit of this repository.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Additional image tag (optional, e.g. "v1.9.0")
        type: string
        default: ''
      platforms:
        description: Target platforms
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      push:
        description: Push the image to GHCR (uncheck for a build-only dry run)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/tool-azure-diagram-builder.yml
      - scripts/mcp-smoke.sh
      - tools/azure-diagram-builder/**
      - vendor/azure-architecture-diagram-builder/**

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: azure-diagram-builder
  VENDOR_DIR: vendor/azure-architecture-diagram-builder
  # The upstream Dockerfile defaults NPM_REGISTRY to a Microsoft-internal proxy.
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  build:
    name: Build and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve build context
        id: context
        env:
          PLATFORMS: ${{ inputs.platforms || 'linux/amd64' }}
        run: |
          # Provenance comes from the mirror, not from a live upstream lookup.
          upstream_repository="$(jq -er '.repository' "${VENDOR_DIR}/UPSTREAM.json")"
          upstream_ref="$(jq -er '.ref' "${VENDOR_DIR}/UPSTREAM.json")"
          upstream_sha="$(jq -er '.commit' "${VENDOR_DIR}/UPSTREAM.json")"

          version="$(jq -r '.version // ""' "${VENDOR_DIR}/package.json")"
          version="${version#v}"

          # The smoke test needs to run the image, which only works when building
          # a single image for the runner's own architecture.
          if [ "${PLATFORMS}" = "linux/amd64" ]; then smoke=true; else smoke=false; fi
          {
            echo "upstream_repository=${upstream_repository}"
            echo "upstream_ref=${upstream_ref}"
            echo "upstream_sha=${upstream_sha}"
            echo "version=${version}"
            echo "registry_owner=${GITHUB_REPOSITORY_OWNER,,}"
            echo "platforms=${PLATFORMS}"
            echo "smoke=${smoke}"
          } >> "$GITHUB_OUTPUT"

      # vendor/ stays a verbatim mirror, so local changes are applied here rather than
      # committed into it.
      - name: Apply local patches
        run: |
          shopt -s nullglob
          patches=(tools/azure-diagram-builder/patches/*.patch)
          if [ ${#patches[@]} -eq 0 ]; then
            echo "No local patches."
            exit 0
          fi
          for patch in "${patches[@]}"; do
            echo "Applying ${patch}"
            git apply --directory="${VENDOR_DIR}" "$patch"
          done

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built and verified before anything is published, so a broken build can never
      # move the `latest` tag that the VPS pulls. The build distils 108 MB of pricing
      # data and 700-odd icons into sidecars inside the image; a tools/list would not
      # notice if those came out empty, so the smoke test calls a tool as well.
      - name: Build image for smoke test
        if: steps.context.outputs.smoke == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.VENDOR_DIR }}
          file: ${{ env.VENDOR_DIR }}/mcp-server/Dockerfile
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Smoke test image
        if: steps.context.outputs.smoke == 'true'
        env:
          MCP_BEARER: smoke-token
          MCP_SMOKE_CALL: '{"name":"list_services","arguments":{}}'
        run: |
          docker run -d --name smoke \
            -e MCP_AUTH_TOKEN=smoke-token \
            -p 127.0.0.1:3030:3030 "${IMAGE_NAME}:smoke"
          trap 'docker logs smoke || true; docker rm -f smoke > /dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3030/healthz; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null http://127.0.0.1:3030/healthz
          echo "health endpoint answers"

          # The bearer gate runs ahead of any MCP handling, so this needs no handshake.
          for token in '' 'wrong-token'; do
            args=(-s -o /dev/null -w '%{http_code}' -X POST
                  -H 'Content-Type: application/json'
                  -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
            [ -n "$token" ] && args+=(-H "Authorization: Bearer ${token}")
            code="$(curl "${args[@]}" http://127.0.0.1:3030/mcp)"
            if [ "$code" != "401" ]; then
              echo "::error::expected 401 for token '${token}', got ${code}"
              exit 1
            fi
          done
          echo "missing and wrong bearer tokens are rejected"

          scripts/mcp-smoke.sh http://127.0.0.1:3030/mcp \
            list_services validate_architecture estimate_costs generate_bicep render_diagram

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.context.outputs.registry_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.context.outputs.version }},enable=${{ steps.context.outputs.version != '' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.title=Azure Diagram Builder MCP server
            org.opencontainers.image.description=Deterministic Azure architecture MCP tools, built from a vendored upstream tree
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ steps.context.outputs.upstream_repository }}
            org.opencontainers.image.version=${{ steps.context.outputs.version }}
            org.opencontainers.image.revision=${{ steps.context.outputs.upstream_sha }}
            org.opencontainers.image.licenses=MIT
            io.workflow.upstream.repository=${{ steps.context.outputs.upstream_repository }}
            io.workflow.upstream.ref=${{ steps.context.outputs.upstream_ref }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.VENDOR_DIR }}
          file: ${{ env.VENDOR_DIR }}/mcp-server/Dockerfile
          build-args: NPM_REGISTRY=${{ env.NPM_REGISTRY }}
          platforms: ${{ steps.context.outputs.platforms }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}

      - name: Attest build provenance
        if: steps.build.outcome == 'success' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.context.outputs.registry_owner }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
          UPSTREAM_REF: ${{ steps.context.outputs.upstream_ref }}
          UPSTREAM_SHA: ${{ steps.context.outputs.upstream_sha }}
          VERSION: ${{ steps.context.outputs.version }}
        run: |
          {
            echo "## azure-diagram-builder"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream ref | \`${UPSTREAM_REF:-unknown}\` |"
            echo "| Upstream commit | \`${UPSTREAM_SHA:-unknown}\` |"
            echo "| Version | \`${VERSION:-unknown}\` |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
