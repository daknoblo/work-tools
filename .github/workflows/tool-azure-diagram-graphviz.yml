name: tool - azure-diagram-graphviz

# Builds the Graphviz-based Azure diagram renderer. Unlike the vendored tools this one
# has no live upstream: dminkovski/azure-diagram-mcp has been dormant since 2025-09-29
# and the code here has diverged from it substantially, so it is maintained in this
# repository rather than mirrored.
#
# Each architecture is built and smoke-tested on a runner of that architecture, then the
# two are joined into one manifest.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Additional image tag (optional)
        type: string
        default: ''
      push:
        description: Push the image to GHCR (uncheck for a build-only dry run)
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - .github/workflows/tool-azure-diagram-graphviz.yml
      - scripts/mcp-smoke.sh
      - tools/azure-diagram-graphviz/**

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  IMAGE_NAME: azure-diagram-graphviz
  CONTEXT_DIR: tools/azure-diagram-graphviz

jobs:
  prepare:
    name: Resolve tags and labels
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ctx.outputs.image }}
      version: ${{ steps.ctx.outputs.version }}
      push: ${{ steps.ctx.outputs.push }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve build context
        id: ctx
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' "${CONTEXT_DIR}/pyproject.toml")"
          {
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
            echo "version=${version}"
            echo "push=${{ github.event_name != 'workflow_dispatch' || inputs.push }}"
          } >> "$GITHUB_OUTPUT"

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ctx.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.ctx.outputs.version }},enable=${{ steps.ctx.outputs.version != '' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
          labels: |
            org.opencontainers.image.title=Azure diagram renderer (Graphviz)
            org.opencontainers.image.description=Renders Azure diagrams from the Python diagrams DSL and returns the PNG inline
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ctx.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
            io.workflow.origin.repository=dminkovski/azure-diagram-mcp
            io.workflow.origin.commit=3a2ce9bfe9bde072b1b105f21cd21aeaaa573568

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Name this platform
        id: plat
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "key=${PLATFORM//\//-}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIR }}
          load: true
          tags: ${{ env.IMAGE_NAME }}:smoke
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}

      - name: Smoke test image
        env:
          # Rendering a real diagram is the only way to know Graphviz is present and
          # working; listing the tool would pass on an image that cannot draw anything.
          MCP_SMOKE_CALL: '{"name":"generate_diagram","arguments":{"code":"with Diagram(\"smoke\"):\n    AppServices(\"web\") >> SQLDatabases(\"db\")"}}'
        run: |
          docker run -d --name smoke -p 127.0.0.1:3002:3002 "${IMAGE_NAME}:smoke"
          trap 'docker logs smoke || true; docker rm -f smoke > /dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 30); do
            if curl -sS -o /dev/null --max-time 3 http://127.0.0.1:3002/mcp; then break; fi
            sleep 2
          done

          scripts/mcp-smoke.sh http://127.0.0.1:3002/mcp \
            generate_diagram get_diagram_examples list_icons

          # The PNG has to come back in the reply: a path would point inside this
          # container, where no caller can reach it.
          image_type="$(curl -sS --max-time 60 \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"generate_diagram","arguments":{"code":"with Diagram(\"smoke\"):\n    AppServices(\"web\")"}}}' \
            http://127.0.0.1:3002/mcp | sed -n 's/^data: //p' | tail -1 \
            | jq -r '[.result.content[] | select(.type == "image") | .mimeType] | first // "none"')"
          if [ "$image_type" != "image/png" ]; then
            echo "::error::generate_diagram returned no inline PNG (got ${image_type})"
            exit 1
          fi
          echo "generate_diagram returns an inline ${image_type}"

          docker run --rm --entrypoint sh "${IMAGE_NAME}:smoke" -c 'test -s /licenses/LICENSE'
          echo "licence ships with the image"

      - name: Build and push by digest
        id: build
        if: needs.prepare.outputs.push == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_DIR }}
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.prepare.outputs.labels }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}

      - name: Export digest
        if: needs.prepare.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: needs.prepare.outputs.push == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.IMAGE_NAME }}-${{ steps.plat.outputs.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish manifest
    needs: [prepare, build]
    if: needs.prepare.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ env.IMAGE_NAME }}-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest
        id: manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ needs.prepare.outputs.image }}
          TAGS: ${{ needs.prepare.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(-t "$tag")
          done <<< "$TAGS"

          docker buildx imagetools create "${tag_args[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

          first="$(printf '%s\n' "$TAGS" | sed -n '1p')"
          digest="$(docker buildx imagetools inspect "$first" \
            --format '{{ json .Manifest }}' | jq -r .digest)"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

          echo "Published architectures:"
          docker buildx imagetools inspect "$first" \
            --format '{{ range .Manifest.Manifests }}{{ if .Platform.Architecture }}  {{ .Platform.OS }}/{{ .Platform.Architecture }}{{ println }}{{ end }}{{ end }}'

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Summary
        if: always()
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## azure-diagram-graphviz"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`${VERSION:-unknown}\` |"
            echo "| Platforms | \`linux/amd64\`, \`linux/arm64\` |"
            echo "| Digest | \`${DIGEST:-n/a}\` |"
            echo
            echo "Tags:"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
