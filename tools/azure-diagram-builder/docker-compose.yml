services:
  azure-diagram-builder:
    image: ghcr.io/daknoblo/azure-diagram-builder:latest
    container_name: azure-diagram-builder
    restart: unless-stopped
    env_file:
      - .env
    # Loopback only: the app has no authentication of its own, so TLS and auth
    # belong in the reverse proxy in front of it.
    ports:
      - 127.0.0.1:8088:80
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - docker_global
networks:
  docker_global:
    external: true
