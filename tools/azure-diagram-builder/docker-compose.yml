services:
  azure-diagram-builder:
    image: ghcr.io/daknoblo/azure-diagram-builder:${IMAGE_TAG:-latest}
    container_name: azure-diagram-builder
    restart: unless-stopped
    env_file:
      - .env
    # Bound to loopback on purpose: terminate TLS and authenticate in a reverse
    # proxy in front of it. The container itself has no authentication.
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:80"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
