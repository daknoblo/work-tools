services:
  azure-diagram-builder:
    image: ghcr.io/daknoblo/azure-diagram-builder:latest
    container_name: azure-diagram-builder
    restart: unless-stopped
    # Tracking a rolling tag, so never reuse a stale local copy of it.
    pull_policy: always
    environment:
      # Base URL only - the server appends `openai/v1/responses` itself.
      AZURE_OPENAI_ENDPOINT: https://YOUR-RESOURCE.services.ai.azure.com/
      # No managed identity outside Azure, so a key is required.
      AZURE_OPENAI_API_KEY: CHANGE_ME
      # Without a token /mcp is completely unauthenticated.
      MCP_AUTH_TOKEN: CHANGE_ME
      # Would let the server identity enumerate a live resource group.
      AZURE_IMPORT_ENABLED: "false"
    # Loopback only: the app has no authentication of its own, so TLS and auth
    # belong in the reverse proxy in front of it.
    ports:
      - 127.0.0.1:8088:80
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - docker_global
networks:
  docker_global:
    external: true
