name: work-tools

services:
  mcp-gateway:
    image: ghcr.io/daknoblo/mcp-gateway:latest
    container_name: mcp-gateway
    restart: unless-stopped
    pull_policy: always
    depends_on:
      azure-diagram-builder:
        condition: service_healthy
      azure-diagram-graphviz:
        condition: service_healthy
      markitdown-mcp:
        condition: service_healthy
    environment:
      MCP_GATEWAY_TOKEN: ${MCP_GATEWAY_TOKEN:?set MCP_GATEWAY_TOKEN in deploy/.env}
      DIAGRAMS_MCP_TOKEN: ${DIAGRAMS_MCP_TOKEN:?set DIAGRAMS_MCP_TOKEN in deploy/.env}
      MCP_GATEWAY_BACKENDS: |
        {
          "diagrams": {
            "url": "http://azure-diagram-builder:3030/mcp",
            "transport": "http",
            "headers": { "Authorization": "Bearer $${DIAGRAMS_MCP_TOKEN}" }
          },
          "markitdown": {
            "url": "http://markitdown-mcp:3001/mcp/",
            "transport": "http"
          },
          "graphviz": {
            "url": "http://azure-diagram-graphviz:3002/mcp",
            "transport": "http"
          }
        }
    ports:
      - 127.0.0.1:${GATEWAY_HOST_PORT:-8191}:8000
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_global

  azure-diagram-builder:
    image: ghcr.io/daknoblo/azure-diagram-builder:latest
    container_name: azure-diagram-builder
    restart: unless-stopped
    pull_policy: always
    environment:
      MCP_AUTH_TOKEN: ${DIAGRAMS_MCP_TOKEN:?set DIAGRAMS_MCP_TOKEN in deploy/.env}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_global

  markitdown-mcp:
    image: ghcr.io/daknoblo/markitdown-mcp:latest
    container_name: markitdown-mcp
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_global

  azure-diagram-graphviz:
    image: ghcr.io/daknoblo/azure-diagram-graphviz:latest
    container_name: azure-diagram-graphviz
    restart: unless-stopped
    pull_policy: always
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - docker_global

networks:
  docker_global:
    external: true
